<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="ui.index.title">QQ 接入方式</title>
<link rel="stylesheet" href="theme.css?v=2">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; min-height:100vh; }
.card { background:var(--card-bg); border-radius:var(--radius-lg); padding:30px 24px; text-align:center; cursor:pointer; transition:.22s; border:1px solid var(--border); flex:1 1 0; min-width:200px; text-decoration:none; color:inherit; display:block; box-shadow:var(--shadow-card); }
.card:hover { border-color:var(--primary); box-shadow:var(--shadow-hover); transform:translateY(-1px); }
.card .icon { width:56px; height:56px; margin:0 auto 14px; border-radius:var(--radius-lg); display:grid; place-items:center; font-size:26px; font-weight:800; background:var(--primary-tint); color:var(--primary-on-tint); }
.card:nth-child(2) .icon { background:var(--warning-tint); color:var(--warning-on-tint); }
.card:nth-child(3) .icon { background:var(--success-tint); color:var(--success-on-tint); }
.card:nth-child(4) .icon { background:var(--fill-subtle); color:var(--muted); }
.card h2 { font-size:18px; margin-bottom:10px; color:var(--text-primary); }
.card p { font-size:12px; color:var(--text-secondary); line-height:1.7; }
.card .tag { display:inline-block; padding:3px 12px; border-radius:999px; font-size:11px; font-weight:700; margin-top:12px; }
.tag-warn { background:var(--warning-tint); color:var(--warning-on-tint); }
.tag-ok { background:var(--success-tint); color:var(--success-on-tint); }
.tag-legacy { background:var(--fill-subtle); color:var(--muted); }
.wrap { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; align-items:stretch; }
h1 { font-size:22px; color:var(--text-primary); text-align:center; margin-bottom:6px; width:100%; }
.sub { color:var(--text-secondary); font-size:13px; text-align:center; margin-bottom:26px; width:100%; }
/* 猫娘小像：纯内联 SVG，不引外部资源（插件要离线可用）。
   装饰性元素，不带文案 —— 所以不需要 i18n 键。 */
.mascot { display:block; margin:0 auto 12px; width:72px; height:72px; }
.mascot .ear, .mascot .face { fill:var(--surface-strong); stroke:var(--primary); stroke-width:3; stroke-linejoin:round; }
.mascot .eye { fill:var(--text); }
.mascot .blush { fill:var(--blush); opacity:.8; }
.mascot .mouth { stroke:var(--primary); stroke-width:3; stroke-linecap:round; fill:none; }
</style>
</head>
<body>
<div style="max-width:900px;width:100%;padding:0 16px;">
    <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true">
        <path class="ear" d="M22 40 L26 14 L44 30 Z"/>
        <path class="ear" d="M78 40 L74 14 L56 30 Z"/>
        <ellipse class="face" cx="50" cy="56" rx="32" ry="29"/>
        <circle class="eye" cx="39" cy="52" r="3.6"/>
        <circle class="eye" cx="61" cy="52" r="3.6"/>
        <ellipse class="blush" cx="31" cy="63" rx="6" ry="4"/>
        <ellipse class="blush" cx="69" cy="63" rx="6" ry="4"/>
        <path class="mouth" d="M44 66 Q50 71 56 66"/>
    </svg>
    <h1 data-i18n="ui.index.title">QQ 接入方式</h1>
    <p class="sub" data-i18n="ui.index.subtitle">请选择一种连接方式。不同方式的配置流程不同，可随时切换。</p>
    <div class="wrap">
        <a class="card" href="status.html?v=2">
            <div class="icon">◉</div>
            <h2 data-i18n="ui.index.status.title">一键部署</h2>
            <p>
                <span data-i18n="ui.index.status.desc1">自动下载并配置 NapCat</span><br>
                <span data-i18n="ui.index.status.desc2">启动后出登录二维码，扫码即用</span>
            </p>
            <span class="tag tag-ok" data-i18n="ui.index.status.tag">自动化</span>
        </a>
        <a class="card" href="napcat.html?v=5" onclick="go('napcat'); return false;">
            <div class="icon">N</div>
            <h2>NapCat</h2>
            <p>
                <span data-i18n="ui.index.napcat.desc1">需要部署 NapCat 进程</span><br>
                <span data-i18n="ui.index.napcat.desc2">支持 QQ 扫码登录</span><br>
                <span data-i18n="ui.index.napcat.desc3">可接收群聊</span><strong>全部消息</strong><br>
                <span data-i18n="ui.index.napcat.desc4">支持戳一戳、表情包等完整能力</span>
            </p>
            <span class="tag tag-warn" data-i18n="ui.index.napcat.tag">全功能 · 多群聊</span>
        </a>
        <a class="card" href="open_platform.html?v=6" onclick="go('open_platform'); return false;">
            <div class="icon">Q</div>
            <h2>QQ 开放平台</h2>
            <p>
                <span data-i18n="ui.index.openplat.desc1">无需额外进程</span><br>
                <span data-i18n="ui.index.openplat.desc2">AppID + 密钥即可接入</span><br>
                <span data-i18n="ui.index.openplat.desc3">仅接收 </span><strong>@机器人</strong> 消息<br>
                <span data-i18n="ui.index.openplat.desc4">支持 Markdown、按钮模板</span>
            </p>
            <span class="tag tag-ok" data-i18n="ui.index.openplat.tag">轻量 · 指令式</span>
        </a>
        <a class="card" href="old.html?v=3" onclick="go('legacy'); return false;">
            <div class="icon">M</div>
            <h2 data-i18n="ui.index.legacy.title">旧版控制中心</h2>
            <p>
                <span data-i18n="ui.index.legacy.desc1">完整的旧版控制面板</span><br>
                <span data-i18n="ui.index.legacy.desc2">引导、状态、回复管理一站式</span>
            </p>
            <span class="tag tag-legacy" data-i18n="ui.index.legacy.tag">旧版 UI</span>
        </a>
    </div>
</div>
<script src="i18n.js?v=2"></script>
<script>
function t(key,fallback){return window.I18n&&typeof window.I18n.t==='function'?window.I18n.t(key,fallback):(fallback||key)}
function go(mode) {
    // ?v= 版本号：击穿浏览器对旧 napcat.html / open_platform.html / old.html 的
    // 强缓存（之前 max-age=3600 缓存 1 小时，改代码后仍看到旧页面）。以后改了
    // 这几个页面记得 +1。
    if (mode === 'legacy') {
        location.href = 'old.html?v=3';
        return;
    }
    localStorage.setItem('qq_connection_mode', mode);
    location.href = mode === 'napcat' ? 'napcat.html?v=5' : 'open_platform.html?v=6';
}
</script>
</body>
</html>
